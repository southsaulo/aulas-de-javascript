<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2 id="texto">Javascript</h2>
  <p id="lorem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Repudiandae.</p>
  <button onclick="document.write('Aula de Javascript!');">Mensagem</button>
  <button onclick="window.alert('Aula de Javascript!');">Mensagem diferente</button>
  <button onclick="window.print();">Imprimir a página</button>
  <button onclick="document.getElementById('texto').innerHTML = 'getElementById()';">Alterar texto</button>
  <p class="pess">Exemplo de parágrafo.</p>
  <button onclick="document.getElementsByTagName('p')[0].innerHTML = '';">Apagar texto</button>
  <script>
    
    document.write("<h3 style='color:blue;'>Olá! Boa tarde!</h3> <br>");
    document.write(5+2);  
    console.log("Teste!");
    document.getElementsByTagName('h2')[0].innerHTML = "exemplo de paragrafo";
    document.getElementById('lorem').innerHTML = '';
    document.getElementsByTagName('p')[1].style.color = "blue";
    document.getElementsByTagName('p')[1].style.fontSize = "20px";
  </script>

</body>
</html>
